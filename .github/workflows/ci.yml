name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: postgresql://localhost:5432/aera_ci
      DIRECT_URL: postgresql://localhost:5432/aera_ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend prisma:generate
      - run: pnpm --filter backend prisma:validate
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend format:check
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend test
      - run: pnpm --filter backend build

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test