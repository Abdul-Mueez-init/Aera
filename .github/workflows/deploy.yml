name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== syncing repo ==="
            cd /home/ubuntu/Aera
            git fetch origin main
            git reset --hard origin/main

            echo "=== cleaning stale npm artifacts ==="
            rm -rf backend/node_modules package-lock.json backend/package-lock.json

            echo "=== ensuring pnpm ==="
            if ! command -v pnpm >/dev/null 2>&1; then
              # User-level install — no sudo required. Standalone pnpm
              # also avoids Corepack's system-symlink permission issues.
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              export PATH="$HOME/.local/share/pnpm:$PATH"
            fi
            pnpm --version

            echo "=== installing dependencies ==="
            pnpm install --frozen-lockfile

            echo "=== prisma generate + migrate ==="
            cd backend
            pnpm prisma:generate
            pnpm prisma:migrate:deploy
            cd ..

            echo "=== restarting service ==="
            sudo systemctl restart aera
            sleep 3
            sudo systemctl status aera --no-pager || true
            sudo systemctl is-active --quiet aera
            echo "=== deploy complete ==="
