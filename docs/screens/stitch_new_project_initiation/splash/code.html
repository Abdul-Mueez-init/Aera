<script>
  (function() {
    const statusMessages = [
      'Calibrating routes...',
      'Verifying zone sensor meshes...',
      'Syncing field dispatch board...',
      'Ready for operation'
    ];
    let step = 0;
    const label = document.getElementById('sync-status');
    const pct = document.getElementById('sync-percentage');
    
    const percentages = ['42%', '78%', '94%', '100%'];

    const interval = setInterval(() => {
      step++;
      if (step < statusMessages.length) {
        if (label) label.textContent = statusMessages[step];
        if (pct) pct.textContent = percentages[step];
      } else {
        clearInterval(interval);
      }
    }, 600);
  })();
